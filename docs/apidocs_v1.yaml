openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://3.39.133.123:8080
    description: Generated server url
paths:
  /api/v1/running:
    get:
      tags:
        - running-controller
      operationId: runningCheck
      responses:
        "200":
          description: OK
  /api/v1/posts:
    get:
      tags:
        - post-controller
      operationId: getPostList
      parameters:
        - name: lastPostId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SliceResponsePostListResponse"
  /api/v1/posts/{postId}:
    get:
      tags:
        - post-controller
      summary: 게시글 상세 조회
      operationId: getPostDetail
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailResponse"
        "404":
          description: 게시글을 찾을 수 없음
components:
  schemas:
    PostListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: integer
          format: int32
        content:
          type: string
        bgmUrl:
          type: string
        isSubscriberOnly:
          type: boolean
        hashtags:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        memberId:
          type: integer
          format: int64
        nickname:
          type: string
        profileImage:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        likeCount:
          type: integer
          format: int64
        commentCount:
          type: integer
          format: int64
    SliceResponsePostListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PostListResponse"
        hasNext:
          type: boolean
        lastPostId:
          type: integer
          format: int64
    PostDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        bgmUrl:
          type: string
        isSubscriberOnly:
          type: integer
          format: int32
        hashtags:
          type: string
        memberId:
          type: integer
          format: int64
        authorName:
          type: string
        authorProfileImage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
